apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "boar.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "boar.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "boar.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "boar.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: boar
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: ADDR
              value: ":{{ .Values.service.port }}"
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
